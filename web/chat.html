<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bebut 채팅</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14171c; --border: #262b33; --text: #e7e9ec; --dim: #9aa2ad;
    --accent: #6ee7b7; --user: #1e2a36; --danger: #f2a0a0; --code-bg: #1b2028;
    --mono: "SFMono-Regular", Consolas, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f8fa; --panel: #fff; --border: #e2e5ea; --text: #16181c; --dim: #5b6270;
            --accent: #0f9d6c; --user: #e8f1fb; --danger: #c0392b; --code-bg: #eef1f5; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.65 var(--sans);
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
           border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; }
  header .model { font: 12px var(--mono); color: var(--dim); min-width: 0; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #06120c; border-color: transparent; font-weight: 600; }
  button.small { font-size: 12px; padding: 2px 8px; border-radius: 6px; color: var(--dim); }
  button.small:hover { color: var(--text); }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .msg { margin: 0 0 18px; word-break: break-word; overflow-wrap: anywhere; min-width: 0; }
  .msg .who { font: 12px var(--mono); color: var(--dim); margin-bottom: 4px; }
  .msg.user .body { background: var(--user); border-radius: 10px; padding: 10px 14px; display: inline-block;
                    white-space: pre-wrap; max-width: 100%; }
  .msg.assistant .body { padding: 2px 0; }
  .msg .meta { font: 11px var(--mono); color: var(--dim); margin-top: 4px; }
  .msg .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .msg .foot { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; margin-top: 6px; }
  .msg .foot .meta { flex: 1 1 auto; margin: 0; min-width: 0; }
  .msg .foot .actions { margin: 0; }
  .msg.error .body { color: var(--danger); white-space: pre-wrap; }
  .empty { color: var(--dim); text-align: center; margin-top: 18vh; }
  .empty b { color: var(--text); }
  /* 마크다운 — 모델 출력은 DOM 노드로만 만든다 (HTML로 해석하지 않는다) */
  .md p { margin: 0 0 8px; }
  .md > :last-child { margin-bottom: 0; }
  .md h3, .md h4, .md h5 { margin: 12px 0 6px; line-height: 1.35; }
  .md h3 { font-size: 17px; } .md h4 { font-size: 16px; } .md h5 { font-size: 15px; }
  .md ul, .md ol { margin: 4px 0 8px; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md code { font: 13px var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .md a { color: var(--accent); }
  .md .code { border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; background: var(--code-bg);
              overflow: hidden; }
  .md .code .head { display: flex; justify-content: space-between; align-items: center; gap: 8px;
                    font: 11px var(--mono); color: var(--dim); padding: 4px 6px 4px 10px;
                    border-bottom: 1px solid var(--border); }
  .md pre { margin: 0; padding: 10px 12px; overflow-x: auto; white-space: pre; overflow-wrap: normal;
            word-break: normal; font: 13px/1.5 var(--mono); }
  .md pre code { background: none; padding: 0; }
  form { border-top: 1px solid var(--border); padding: 12px 16px; }
  form .wrap { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--panel);
             border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
             max-height: 200px; min-height: 44px; min-width: 0; }
  textarea:focus { outline: none; border-color: var(--accent); }
  details { max-width: 820px; margin: 0 auto 8px; font-size: 13px; color: var(--dim); }
  details .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                  gap: 8px 16px; padding: 8px 0; }
  label { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  input[type=number] { width: 72px; font: 13px var(--mono); color: var(--text); background: var(--panel);
                       border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
  details textarea { width: 100%; min-height: 0; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>bebut</h1><span class="model" id="model">연결 중…</span>
  <span class="spacer"></span>
  <button type="button" id="clear">새 대화</button>
</header>
<div id="log"><div class="wrap" id="msgs" aria-live="polite" aria-relevant="additions text"></div></div>
<form id="form" novalidate>
  <details>
    <summary>생성 설정</summary>
    <div class="grid">
      <label>temperature <input type="number" id="temperature" value="0.7" step="any" min="0" max="2"></label>
      <label>top_p <input type="number" id="top_p" value="0.95" step="any" min="0" max="1"></label>
      <label>max_tokens <input type="number" id="max_tokens" value="384" step="any" min="1"></label>
      <label>반복 억제 <input type="number" id="repetition_penalty" value="1.1" step="any" min="0.5" max="3"></label>
    </div>
    <textarea id="system" rows="2" placeholder="시스템 프롬프트 (선택 — SFT 데이터엔 없던 형식이라 효과가 약할 수 있습니다)"></textarea>
  </details>
  <div class="wrap">
    <textarea id="input" rows="1" placeholder="메시지 입력 (Shift+Enter 줄바꿈)" autofocus></textarea>
    <button class="primary" id="send" type="submit">전송</button>
  </div>
</form>
<script>
const $ = (id) => document.getElementById(id);
const STORE = "bebut-chat-v1";
const PARAMS = ["temperature", "top_p", "max_tokens", "repetition_penalty"];
const INTRO = "intro";
let history = [];        // [{role: "user"|"assistant", content, meta?}] — 서버엔 role·content만 보낸다
let pending = null;      // 답을 못 받은 마지막 사용자 턴의 표시 {text, retry}
let controller = null;
let conversation = 0;    // "새 대화"마다 증가 — 중지된 이전 대화의 답이 새 기록에 섞이지 않게
let placeholder = INTRO;

fetch("/v1/models").then(r => r.json()).then(d => {
  const m = d.data[0];
  $("model").textContent = `${m.id} · ctx ${m.context_length}`;
}).catch(() => { $("model").textContent = "서버 연결 실패"; });

// ---------------- 저장 (localStorage가 막혀 있어도 동작) ----------------

function save() {
  try {
    const settings = { system: $("system").value };
    for (const k of PARAMS) settings[k] = $(k).value;
    localStorage.setItem(STORE, JSON.stringify({ history, settings }));
  } catch (e) { /* 저장소를 못 쓰는 환경 — 기록만 안 남는다 */ }
}

function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) { data = null; }
  if (!data || typeof data !== "object") return;
  if (Array.isArray(data.history)) {
    history = data.history.filter(m => m && (m.role === "user" || m.role === "assistant")
                                          && typeof m.content === "string")
                          .map(m => ({ role: m.role, content: m.content,
                                       ...(typeof m.meta === "string" ? { meta: m.meta } : {}) }));
    // 답이 없는 사용자 턴으로 끝났으면(전송 중 새로고침) 다시 시도할 수 있게 표시
    if (history.length && history[history.length - 1].role === "user") {
      pending = { text: "답을 받기 전에 페이지를 떠났습니다.", retry: true };
    }
  }
  const s = data.settings || {};
  for (const k of [...PARAMS, "system"]) if (typeof s[k] === "string") $(k).value = s[k];
}

// ---------------- 마크다운 → DOM (HTML 문자열을 만들지 않는다) ----------------

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

function safeHref(url) {
  if (!/^https?:\/\//i.test(url)) return null;
  try {
    const u = new URL(url);
    return u.protocol === "http:" || u.protocol === "https:" ? u.href : null;
  } catch (e) { return null; }
}

const URL_STOP = /[\s<>()\[\]]/;
const URL_TRAIL = /[.,!?;:'"]/;

// 한 줄의 인라인 마크다운을 DOM 노드로. 앞에서부터 한 번만 훑는다.
// 예전에는 매 단계 남은 텍스트 전체에 정규식 다섯 개를 다시 돌려 O(n²)이었고, 닫히지 않는
// ** 가 많으면 O(n³)까지 갔다 (모델 출력 수만 자에서 화면이 수 초씩 멈췄다).
// 규칙은 그때 정규식과 같다: 가장 왼쪽 매치, 같은 위치면 code → bold → italic → link → url.
//   code   `내용`            bold  **내용** (안쪽 양끝이 공백이 아님)
//   italic *내용* (* 없음)   link  [글자](주소)   url  http(s)://…
// 닫는 기호 위치는 앞으로만 움직이는 캐시에 담아, 같은 구간을 여러 번 훑지 않는다.
function inline(text) {
  const out = [];
  let buf = "";
  const pushText = () => { if (buf) { out.push(document.createTextNode(buf)); buf = ""; } };
  const isSpace = (ch) => /\s/.test(ch);
  let tick = -1, boldAt = -1, rbr = -1;   // 다음 ` · 유효한 닫는 ** · 다음 ] 위치 캐시
  const parenCache = new Map();            // "](" 위치 → 닫는 ) 위치 또는 -1
  const nextIndex = (cache, needle, from) => (cache >= from || cache === Infinity)
    ? cache : ((i) => (i === -1 ? Infinity : i))(text.indexOf(needle, from));
  const boldCloser = (from) => {           // from 이상에서 앞 글자가 공백이 아닌 첫 "**"
    if (boldAt >= from || boldAt === Infinity) return boldAt;
    let j = text.indexOf("**", Math.max(from, boldAt + 1));
    while (j !== -1 && isSpace(text[j - 1])) j = text.indexOf("**", j + 1);
    return (boldAt = j === -1 ? Infinity : j);
  };
  let i = 0;
  while (i < text.length) {
    const c = text[i];
    if (c === "`") {
      tick = nextIndex(tick, "`", i + 1);
      if (tick !== Infinity && tick > i + 1) {
        pushText(); out.push(el("code", "", text.slice(i + 1, tick)));
        i = tick + 1; continue;
      }
    } else if (c === "*") {
      if (text[i + 1] === "*" && i + 2 < text.length && !isSpace(text[i + 2])) {
        const j = boldCloser(i + 3);
        if (j !== Infinity) {
          pushText(); const b = el("strong"); b.append(...inline(text.slice(i + 2, j))); out.push(b);
          i = j + 2; continue;
        }
      }
      const nx = text[i + 1];
      if (nx !== undefined && nx !== "*" && !isSpace(nx)) {
        const j = text.indexOf("*", i + 1);  // italic 안에는 *가 없으므로 바로 다음 *가 닫는 기호
        if (j > i + 1 && !isSpace(text[j - 1])) {
          pushText(); const em = el("em"); em.append(...inline(text.slice(i + 1, j))); out.push(em);
          i = j + 1; continue;
        }
      }
    } else if (c === "[") {
      rbr = nextIndex(rbr, "]", i + 1);
      if (rbr !== Infinity && rbr > i + 1 && text[rbr + 1] === "(") {
        const k = rbr;
        if (!parenCache.has(k)) {
          let m = k + 2;
          while (m < text.length && text[m] !== ")" && !isSpace(text[m])) m++;
          parenCache.set(k, m < text.length && text[m] === ")" && m > k + 2 ? m : -1);
        }
        const m = parenCache.get(k);
        if (m !== -1) {
          pushText();
          const label = text.slice(i + 1, k), href = safeHref(text.slice(k + 2, m));
          if (href) {
            const a = el("a", "", label);
            a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
            out.push(a);
          } else {
            out.push(document.createTextNode(text.slice(i, m + 1)));  // 안전하지 않은 링크는 글자 그대로
          }
          i = m + 1; continue;
        }
      }
    } else if ((c === "h" || c === "H") && /^https?:\/\//.test(text.slice(i, i + 8))) {
      let e = i + (text[i + 4] === "s" ? 8 : 7);
      const bodyStart = e;
      while (e < text.length && !URL_STOP.test(text[e])) e++;
      while (e > bodyStart && URL_TRAIL.test(text[e - 1])) e--;  // 문장 끝 마침표 등은 링크에서 뺀다
      if (e - bodyStart >= 2) {
        const href = safeHref(text.slice(i, e));
        if (href) {
          pushText();
          const a = el("a", "", text.slice(i, e));
          a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
          out.push(a);
          i = e; continue;
        }
      }
    }
    buf += c;
    i++;
  }
  pushText();
  return out;
}

function codeBlock(lang, code, open) {
  const box = el("div", "code");
  const head = el("div", "head");
  head.append(el("span", "", (lang || "code") + (open ? " …" : "")));
  const btn = el("button", "small", "복사");
  btn.type = "button";
  btn.addEventListener("click", () => copyText(code, btn));
  head.append(btn);
  const pre = el("pre");
  pre.append(el("code", "", code));
  box.append(head, pre);
  return box;
}

function markdown(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let para = [];
  const flush = () => {
    if (!para.length) return;
    const p = el("p");
    para.forEach((ln, i) => { if (i) p.append(el("br")); p.append(...inline(ln)); });
    out.push(p);
    para = [];
  };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const fence = /^\s*```\s*([\w+#.-]*)\s*$/.exec(line);
    if (fence) {
      flush();
      const code = [];
      let j = i + 1;
      while (j < lines.length && !/^\s*```\s*$/.test(lines[j])) code.push(lines[j++]);
      out.push(codeBlock(fence[1], code.join("\n"), j >= lines.length));  // 닫히지 않음 = 생성 중
      i = j;
      continue;
    }
    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    if (h) { flush(); const n = el("h" + (h[1].length + 2)); n.append(...inline(h[2])); out.push(n); continue; }
    const ul = /^\s*[-*]\s+(.*)$/.exec(line), ol = /^\s*(\d+)[.)]\s+(.*)$/.exec(line);
    if (ul || ol) {
      flush();
      const list = el(ul ? "ul" : "ol");
      if (ol && ol[1] !== "1") list.start = Number(ol[1]);
      const re = ul ? /^\s*[-*]\s+(.*)$/ : /^\s*\d+[.)]\s+(.*)$/;
      let m;
      while (i < lines.length && (m = re.exec(lines[i]))) {
        const li = el("li"); li.append(...inline(m[1])); list.append(li); i++;
      }
      i--;
      out.push(list);
      continue;
    }
    if (!line.trim()) { flush(); continue; }
    para.push(line);
  }
  flush();
  return out;
}

// ---------------- 화면 ----------------

const nearBottom = () => { const l = $("log"); return l.scrollHeight - l.scrollTop - l.clientHeight < 80; };
function stick(was) { if (was) $("log").scrollTop = $("log").scrollHeight; }

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = el("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
  }
  const prev = btn.textContent;
  btn.textContent = ok ? "복사됨" : "복사 실패";
  setTimeout(() => { btn.textContent = prev; }, 1200);
}

function bubble(role, content) {
  const m = el("div", `msg ${role}`);
  m.append(el("div", "who", role === "user" ? "나" : role === "assistant" ? "bebut" : "오류"));
  const body = el("div", role === "assistant" ? "body md" : "body");
  if (role === "assistant") body.append(...markdown(content)); else body.textContent = content;
  m.append(body);
  return m;
}

function render() {
  const was = nearBottom();
  const box = $("msgs");
  box.replaceChildren();
  if (!history.length && !pending) {
    const p = el("p", "empty");
    p.id = "empty";
    if (placeholder === INTRO) {
      p.append(el("b", "", "한국어 1.2B 모델"), "과 대화해 보세요.", el("br"),
               "사실 질문은 잘 맞히지만 계산과 드문 사실은 틀립니다.");
    } else {
      p.textContent = "새 대화를 시작합니다.";
    }
    box.append(p);
  }
  const lastA = history.map(m => m.role).lastIndexOf("assistant");
  history.forEach((msg, i) => {
    const b = bubble(msg.role, msg.content);
    if (msg.role === "assistant") {
      const actions = el("div", "actions");
      const copy = el("button", "small", "복사");
      copy.type = "button";
      copy.addEventListener("click", () => copyText(msg.content, copy));
      actions.append(copy);
      if (i === lastA && i === history.length - 1) {
        const regen = el("button", "small", "다시 생성");
        regen.type = "button";
        regen.className = "small regen";
        regen.addEventListener("click", regenerate);
        actions.append(regen);
      }
      const foot = el("div", "foot");
      foot.append(el("div", "meta", msg.meta || ""), actions);  // 통계는 왼쪽, 버튼은 오른쪽
      b.append(foot);
    }
    box.append(b);
  });
  if (pending) {
    const e = bubble("error", pending.text);
    if (pending.retry) {
      const actions = el("div", "actions");
      const retry = el("button", "small", "다시 시도");
      retry.type = "button";
      retry.addEventListener("click", () => { if (!controller) { pending = null; render(); ask(); } });
      actions.append(retry);
      e.append(actions);
    }
    box.append(e);
  }
  stick(was || !history.length);
}

function setBusy(busy) {
  $("send").textContent = busy ? "중지" : "전송";
  $("send").classList.toggle("primary", !busy);
  for (const b of document.querySelectorAll("button.regen")) b.disabled = busy;
}

function statsLine(sec, usage, finish) {
  const parts = [`${sec.toFixed(1)}s`];
  if (usage) {
    const n = usage.completion_tokens;
    parts.push(`${n}토큰`);
    if (sec >= 0.05) parts.push(`${(n / sec).toFixed(1)} tok/s`);  // 너무 짧으면 속도가 의미 없다
    const cached = usage.prompt_tokens_details?.cached_tokens || 0;
    if (cached > 0) parts.push(`문맥 ${usage.prompt_tokens}토큰 중 ${cached}토큰 캐시 재사용`);
  }
  if (finish === "length") parts.push("길이 한도");
  if (finish === "중지됨") parts.push("중지됨");
  return parts.join(" · ");
}

// ---------------- 생성 ----------------

/** 기록(사용자 턴으로 끝남)에 대한 답을 스트리밍으로 받는다. */
async function ask() {
  const conv = conversation;
  const live = bubble("assistant", "");
  const body = live.querySelector(".body");
  $("empty")?.remove();
  $("msgs").append(live);
  stick(true);
  const sys = $("system").value.trim();
  const turns = history.map(m => ({ role: m.role, content: m.content }));
  const messages = sys ? [{ role: "system", content: sys }, ...turns] : turns;
  const params = {};
  for (const k of PARAMS) params[k] = Number($(k).value);
  controller = new AbortController();
  setBusy(true);
  const t0 = performance.now();
  let raw = "", finish = "", usage = null, error = null, frame = 0;
  const paint = () => {
    frame = 0;
    const was = nearBottom();
    body.replaceChildren(...markdown(raw));
    stick(was);
  };
  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
      body: JSON.stringify({ messages, stream: true, stream_options: { include_usage: true }, ...params }),
    });
    if (!res.ok) {
      let msg = res.statusText;
      try { msg = (await res.json()).error?.message || msg; } catch (e) { /* JSON이 아닌 오류 응답 */ }
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).replace(/^data: /, "");
        buf = buf.slice(i + 2);
        if (!line || line === "[DONE]") continue;
        const obj = JSON.parse(line);
        if (obj.error) throw new Error(obj.error.message || "서버 오류");  // 스트리밍 중 서버 오류
        if (obj.usage) usage = obj.usage;
        const c = obj.choices?.[0];
        if (!c) continue;
        if (c.delta?.content) {
          raw += c.delta.content;
          if (!frame) frame = requestAnimationFrame(paint);  // 화면 갱신은 프레임당 한 번
        }
        if (c.finish_reason) finish = c.finish_reason;
      }
    }
  } catch (e) {
    if (e.name === "AbortError") finish = "중지됨"; else error = String(e.message || e);
  } finally {
    if (frame) cancelAnimationFrame(frame);
    controller = null;
    setBusy(false);
  }
  if (conv !== conversation) return;  // 스트리밍 중에 "새 대화"를 눌렀다
  const sec = (performance.now() - t0) / 1000;
  if (!error && raw.trim()) {
    history.push({ role: "assistant", content: raw.trim(), meta: statsLine(sec, usage, finish) });
    pending = null;
  } else {
    pending = error ? { text: error, retry: true } : { text: "답을 받기 전에 중지했습니다.", retry: true };
  }
  save();
  render();
}

function send(text) {
  if (history.length && history[history.length - 1].role === "user") history.pop();  // 답 못 받은 턴은 버린다
  pending = null;
  history.push({ role: "user", content: text });
  save();
  render();
  ask();
}

function regenerate() {
  if (controller || !history.length || history[history.length - 1].role !== "assistant") return;
  history.pop();
  pending = null;
  save();
  render();
  ask();
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  $("input").style.height = "";
  send(text);
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", (e) => {
  e.target.style.height = "";
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px";
});
for (const k of [...PARAMS, "system"]) $(k).addEventListener("change", save);
$("clear").addEventListener("click", () => {
  conversation++;
  if (controller) controller.abort();
  history = [];
  pending = null;
  placeholder = "new";
  save();
  render();
});

load();
render();
</script>
</body>
</html>
